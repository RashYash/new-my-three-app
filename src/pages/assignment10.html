<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Customizer</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
      }

      #model-container {
        position: fixed;
        inset: 0;
      }

      .controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 100;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: orange;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <div id="model-container"></div>
    <div class="controls">
      <button id="goldCar">gold</button>
      <button id="blueCar">Blue</button>
    </div>

    <script type="module" src="../js/assignment10.js"></script>
  </body>
</html>

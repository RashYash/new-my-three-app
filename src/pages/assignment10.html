<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Customizer</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #111;
      }

      #model-container10 {
        position: fixed;
        inset: 0;
      }

      .controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 100;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: orange;
        font-weight: bold;
        cursor: pointer;
      }
      .color-group {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .color-circle {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        border: 2px solid white;
        cursor: pointer;
        padding: 0;
      }

      .gold {
        background: gold;
      }

      .blue {
        background: blue;
      }

      .red {
        background: red;
      }

      .black {
        background: black;
      }

      .silver {
        background: silver;
      }

      .green {
        background: green;
      }

      button:hover {
        transform: scale(1.05);
      }

      .back-btn {
        position: absolute;
        top: 15px;
        left: 15px;
        background: black;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        z-index: 200;
      }
    </style>
  </head>

  <body>
    <button class="back-btn" onclick="goHome()">Back</button>

    <div id="model-container10"></div>

    <div class="controls">
      <button id="bodyBtn">Body Color</button>

      <div class="color-group">
        <button class="color-circle gold" id="goldCar"></button>
        <button class="color-circle blue" id="blueCar"></button>
        <button class="color-circle red" id="redCar"></button>
      </div>
      
      <button id="wheelBtn">Rim Color</button>

      <div class="color-group">
        <button class="color-circle black" id="blackRim"></button>
        <button class="color-circle silver" id="silverRim"></button>
        <button class="color-circle green" id="greenRim"></button>
      </div>
    </div>

    <script type="module" src="../js/assignment10.js"></script>

    <script>
      function goHome() {
        window.location.href = "/new-my-three-app/";
      }
    </script>
  </body>
</html>

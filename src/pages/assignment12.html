<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 12 - MindAR</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial;
      }

      #container {
        width: 100vw;
        height: 100vh;
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      .ui {
        position: absolute;
        z-index: 10;
      }

      button {
        padding: 10px 16px;
        margin: 5px;
        border: none;
        background: #4ee0ef;
        font-weight: bold;
        cursor: pointer;
        border-radius: 10px;
      }
      .back-btn {
        top: 15px;
        left: 15px;
        position: absolute;
        background: black;
        color: white;
        padding: 8px 14px;
        border: none;
        cursor: pointer;
      }

      #controls {
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        position: absolute;
        display: flex;
        gap: 10px;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <button class="back-btn ui" onclick="goHome()">Back</button>
    <div id="container"></div>

    <div id="controls" class="ui">
      <button id="startButton">Start AR</button>
      <button id="stopButton">Stop AR</button>
    </div>

    <script type="module" src="../js/assignment12.js"></script>
    <script>
      function goHome() {
        window.location.href = "/new-my-three-app/";
      }
    </script>
  </body>
</html>

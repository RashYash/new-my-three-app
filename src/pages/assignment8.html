<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Assignment 8 - Quizard UI</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #18135b;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: white;
      }

      .container8 {
        position: relative;
        width: 300px;
        height: 72vh;
        background: #221b73;
        text-align: center;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 40px;
        border-radius: 30px;
      }

      .container8::before,
      .container8::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(124, 118, 255, 0.18);
        z-index: 0;
      }

      .container8::before {
        width: 200px;
        height: 100px;
        top: -30px;
        right: -30px;
      }

      .container8::after {
        width: 220px;
        height: 140px;
        bottom: 150px;
        left: -70px;
        border-radius: 40% 60% 50% 50%;
      }

      h1 {
        font-size: 48px;
        font-weight: bold;
        margin: 0;
        z-index: 2;
      }

      p {
        font-size: 16px;
        line-height: 1.4;
        opacity: 0.9;
        width: 240px;
        margin-top: 10px;
        margin-bottom: 25px;
        z-index: 2;
      }

      #model-container8 {
        width: 240px;
        height: 240px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        z-index: 2;
        margin-bottom: 30px;
      }

      button {
        width: 180px;
        padding: 12px;
        border: none;
        border-radius: 16px;
        background: #4ee0ef;
        color: #1b1464;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
        z-index: 2;
      }

      button:hover {
        transform: scale(1.05);
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        width: auto;
        padding: 8px 16px;
        border: none;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        cursor: pointer;
        z-index: 1000;
        border-radius: 10px;
        font-size: 13px;
      }

      .back-btn:hover {
        background: black;
      }
    </style>
  </head>

  <body>
    <button class="back-btn" onclick="goHome()">Back</button>

    <div class="container8">
      <h1>Quizard</h1>
      <p>1,000+ quizzes to challenge you and your friends on all topics!</p>
      <div id="model-container8"></div>
      <button>Start playing</button>
    </div>

    <script type="module" src="/src/js/assignment8.js"></script>

    <script>
      function goHome() {
        window.location.href = "/";
      }
    </script>
  </body>
</html>
